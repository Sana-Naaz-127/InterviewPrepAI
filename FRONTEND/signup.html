<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup | Interview Prep AI</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
        }

        .signup-container{
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .signup-container h2{
            text-align: center;
            margin-bottom: 20px;
        }

        .signup-container input{
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .signup-container button{
            width: 100%;
            padding: 12px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .signup-container button:hover{
            background: #0056b3;
        }

    </style>

</head>

<body>

    <div class="signup-container">

        <h2>Create Account</h2>

        <form id="signupForm">

            <input 
                type="text" 
                id="name" 
                placeholder="Enter your name"
                required
            >

            <input 
                type="email" 
                id="email" 
                placeholder="Enter your email"
                required
            >

            <input 
                type="password" 
                id="password" 
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Sign Up
            </button>

        </form>

    </div>

    <script src="signup.js"></script>

</body>

</html>
