<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Interview Session | InterviewPrepAI</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="interview-session.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

</head>
<script src="interview-session.js"></script>

<body>

  <!-- ================= TOP BAR ================= -->

  <section class="session-topbar">

    <div>
      Frontend Interview
    </div>

    <div>
      Time Left: 24:12
    </div>

    <div>
      Question 3/10
    </div>

  </section>

  <!-- ================= SESSION INFO ================= -->

  <div class="session-info">

  <h2 id="roleText"></h2>
  <p id="typeText"></p>
  <p id="difficultyText"></p>
  <p id="skillsText"></p>

</div>

  <!-- ================= CHAT AREA ================= -->

  <section class="chat-section">

    <div class="chat-window">

      <!-- AI MESSAGE -->

      <div class="message ai-message">

        <p>
          Explain event delegation in JavaScript.
        </p>

      </div>

      <!-- USER MESSAGE -->

      <div class="message user-message">

        <p>
          Event delegation is a technique where
          events are handled at a parent level.
        </p>

      </div>

    </div>

  </section>

  <!-- ================= INPUT AREA ================= -->

  <section class="input-section">

    <div class="input-container">

      <input
        type="text"
        placeholder="Type your answer here..."
      >

      <button class="mic-btn">
        <i class="fa-solid fa-microphone"></i>
      </button>

      <button class="send-btn">
        <i class="fa-solid fa-paper-plane"></i>
      </button>

    </div>

    <!-- CONTROLS -->

    <div class="controls">

      <button>
        Next Question
      </button>

      <button>
        Skip Question
      </button>

      <button>
        End Interview
      </button>

    </div>

  </section>

</body>

</html>
